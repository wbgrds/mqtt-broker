version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      - ./certs:/mosquitto/certs:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      # MQTT unverschlüsselt (1883)
      - "traefik.tcp.routers.mqtt.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mqtt.entrypoints=mqtt"
      - "traefik.tcp.routers.mqtt.service=mqtt-svc"
      - "traefik.tcp.services.mqtt-svc.loadbalancer.server.port=1883"
      # MQTT TLS (8883) mit LE-Cert
      - "traefik.tcp.routers.mqtt-tls.rule=HostSNI(`mqtt.ob5.dev`)"
      - "traefik.tcp.routers.mqtt-tls.entrypoints=mqtt-tls"
      - "traefik.tcp.routers.mqtt-tls.service=mqtt-tls-svc"
      - "traefik.tcp.routers.mqtt-tls.tls.certresolver=letsencrypt"
      - "traefik.tcp.services.mqtt-tls-svc.loadbalancer.server.port=8883"
      # WebSocket (9001)
      - "traefik.http.routers.mqtt-ws.rule=Host(`mqtt.ob5.dev`)"
      - "traefik.http.routers.mqtt-ws.entrypoints=websecure"
      - "traefik.http.routers.mqtt-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.mqtt-ws.loadbalancer.server.port=9001"
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: certbot-mqtt
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
    networks:
      - traefik
    command: >
      certonly --standalone
      -d mqtt.ob5.dev
      --non-interactive --agree-tos
      -m admin@ob5.dev
      --keep-until-expiring
    restart: unless-stopped

networks:
  traefik:
    external: true
